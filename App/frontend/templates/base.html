<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}VoiceOfOpenDoor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='odd-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='odd-layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='odd-components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='odd-utilities.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <nav aria-label="Workbench">
        <ul class="nav-list">
            {% for slug, label, path in tools %}
            <li{% if active == slug %} aria-current="page"{% endif %}>
                <button type="button" class="as-link{% if slug == 'home' %} home-link{% endif %}" data-href="{{ path }}">{% if slug == 'home' %}<img src="{{ url_for('static', filename='dino_home_wave.png') }}" alt="Dino waves you home">{% else %}{{ label }}{% endif %}</button>
            </li>
            {% endfor %}
        </ul>
    </nav>

    <main id="main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
